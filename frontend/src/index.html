<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>DineForge POS</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Applied before body paints, to avoid a flash of the wrong theme.
    try {
      var savedTheme = localStorage.getItem('dineforge_theme');
      if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="setupWizard" class="wizard-overlay" hidden></div>
  <div id="roleLogin" class="wizard-overlay" hidden></div>
  <header class="topbar">
    <div class="brand">
      <img src="assets/icon.png" alt="" />
      DineForge POS
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="pos">Order</button>
      <button class="tab" data-view="kitchen">Kitchen</button>
      <button class="tab" data-view="admin">Admin</button>
    </nav>
    <button class="btn" id="logoutBtn" type="button" hidden>Log Out</button>
    <button class="btn theme-toggle" id="themeToggle" type="button">Dark</button>
    <div class="shift-status" id="shiftStatus"><span class="shift-dot"></span> Loading…</div>
  </header>
  <main id="views">
    <section id="view-pos" class="view active"></section>
    <section id="view-kitchen" class="view"></section>
    <section id="view-admin" class="view"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
